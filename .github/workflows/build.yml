name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build, test, package
        run: ./build.sh

      - name: Blaze3D adapter test
        run: |
          curl -fsSL -o /tmp/joml.jar https://repo1.maven.org/maven2/org/joml/joml/1.10.9/joml-1.10.9.jar
          JOML_JAR=/tmp/joml.jar ./build-blaze3d.sh

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: versor-java-1.0.0
          path: dist/*.jar
          if-no-files-found: error
